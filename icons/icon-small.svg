<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- YouTube Split Scroll: simplified logo for 16px and 32px (toolbar). Shapes sit on
       even coordinates so they stay pixel-aligned at 16px. Rendered by scripts/build-icons.mjs. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Left column: comments. -->
  <g fill="#ffffff">
    <rect x="4" y="6" width="10" height="4" rx="2"/>
    <rect x="4" y="14" width="10" height="4" rx="2"/>
    <rect x="4" y="22" width="7" height="4" rx="2"/>
  </g>

  <!-- Divider. -->
  <rect x="16" y="6" width="2" height="20" rx="1" fill="#ffffff" opacity="0.4"/>

  <!-- Right column: docked player and suggestions. -->
  <rect x="20" y="6" width="8" height="6" rx="1.5" fill="#ffffff"/>
  <path d="M22.75 7.5v3l2.75-1.5z" fill="#0d9488"/>
  <g fill="#ffffff" opacity="0.6">
    <rect x="20" y="16" width="8" height="2" rx="1"/>
    <rect x="20" y="20" width="8" height="2" rx="1"/>
    <rect x="20" y="24" width="5" height="2" rx="1"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- YouTube Split Scroll: detailed logo (48px and up). Rendered to PNG by scripts/build-icons.mjs. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#042f2e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect width="128" height="128" rx="28" fill="url(#shine)"/>

  <!-- Left column: comments (avatar + two lines), the last one fading out as it scrolls. -->
  <g fill="#ffffff">
    <circle cx="24" cy="30" r="7"/>
    <rect x="35" y="24" width="27" height="6" rx="3"/>
    <rect x="35" y="33" width="18" height="5" rx="2.5" opacity="0.65"/>

    <circle cx="24" cy="56" r="7"/>
    <rect x="35" y="50" width="22" height="6" rx="3"/>
    <rect x="35" y="59" width="27" height="5" rx="2.5" opacity="0.65"/>

    <circle cx="24" cy="82" r="7"/>
    <rect x="35" y="76" width="27" height="6" rx="3"/>
    <rect x="35" y="85" width="14" height="5" rx="2.5" opacity="0.65"/>

    <g opacity="0.4">
      <circle cx="24" cy="108" r="7"/>
      <rect x="35" y="102" width="20" height="6" rx="3"/>
    </g>
  </g>

  <!-- Divider with a grip: the columns scroll independently and can be resized. -->
  <rect x="70.75" y="18" width="2.5" height="92" rx="1.25" fill="#ffffff" opacity="0.35"/>
  <rect x="68" y="54" width="8" height="20" rx="4" fill="#ffffff"/>

  <!-- Right column: docked player above the suggestions. -->
  <g filter="url(#lift)">
    <rect x="82" y="20" width="32" height="24" rx="5" fill="#ffffff"/>
  </g>
  <path d="M94.5 26.5v11l9-5.5z" fill="#0d9488"/>
  <g fill="#ffffff" opacity="0.6">
    <rect x="82" y="52" width="12" height="9" rx="2.5"/>
    <rect x="97" y="53" width="17" height="3.5" rx="1.75"/>
    <rect x="82" y="68" width="12" height="9" rx="2.5"/>
    <rect x="97" y="69" width="13" height="3.5" rx="1.75"/>
    <rect x="82" y="84" width="12" height="9" rx="2.5"/>
    <rect x="97" y="85" width="17" height="3.5" rx="1.75"/>
  </g>
  <g fill="#ffffff" opacity="0.3">
    <rect x="82" y="100" width="12" height="9" rx="2.5"/>
    <rect x="97" y="101" width="11" height="3.5" rx="1.75"/>
  </g>
</svg>
